name: web

on:
  push:
    branches: [master, staging]
    paths: ["apps/web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:test
      - run: pnpm web:build
